name: Build resume PDF

# Compiles maria_cruz_resume.tex on every push to main and publishes it with
# GitHub Pages, so it opens in the browser at a stable link used by the portfolio:
# https://maria0406.github.io/resume/maria_cruz_resume.pdf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: maria_cruz_resume.tex

      - name: Assemble site
        run: |
          mkdir site
          cp maria_cruz_resume.pdf site/
          # The bare URL opens the PDF too
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=maria_cruz_resume.pdf"><title>Maria Cruz resume</title><a href="maria_cruz_resume.pdf">Resume (PDF)</a>\n' > site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
